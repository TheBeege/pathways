services:
  graphdb:
    image: dgraph/standalone
    ports:
    - name: HTTP
      published: 8080
      target: 8080 
    - name: gRPC
      published: 9080
      target: 9080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pathways_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - name: HTTP
      published: 5000
      target: 5000
    depends_on:
      graphdb:
        condition: service_healthy
